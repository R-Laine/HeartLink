[versions]
agp = "8.13.0"
kotlin = "2.2.20"
googleServices = "4.4.2"

compileSdk = "36"
targetSdk = "35"
phoneMinSdk = "26"
watchMinSdk = "30"

composeBom = "2024.12.01"
activityCompose = "1.9.3"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
fragment = "1.8.5"
coroutines = "1.8.1"
firebaseBom = "33.6.0"
wearCompose = "1.4.0"
wearInput = "1.2.0"
healthServices = "1.0.0-rc02"
guava = "33.3.1-android"
healthConnect = "1.1.0"
work = "2.10.0"
playServicesWearable = "19.0.0"
playServicesLocation = "21.3.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
